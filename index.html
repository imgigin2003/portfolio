<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://db.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="Negin Parseh — AI Engineer & Backend Developer. A portfolio of intelligent systems and reliable backend infrastructure."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      />
    </noscript>
    <title>Negin Parseh — AI Engineer & Backend Developer</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader { display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #272822; }
        .initial-loader-spinner { width: 32px; height: 32px; border: 3px solid rgba(197, 179, 211, 0.2); border-top-color: #C5B3D3; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        html:not(.dark) .initial-loader { background-color: #FCF8F8; }
        html:not(.dark) .initial-loader-spinner { border-color: rgba(143, 112, 165, 0.2); border-top-color: #8F70A5; }
      </style>
      <div class="initial-loader">
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
